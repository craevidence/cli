rules:
  - id: cra-java-runtime-exec-request
    message: >
      HTTP request data reaches an operating system command. Pass a fixed
      executable and validated arguments without invoking a command shell.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology: [java, servlet]
      confidence: HIGH
      scope: >
        Detects request data reaching Runtime.exec or a single-argument
        ProcessBuilder constructor through flows supported within one file.
        Request data is servlet getParameter, getHeader, and getQueryString,
        plus Spring handler parameters annotated @RequestParam, @PathVariable,
        or @RequestBody. A command sequence whose first element is a string
        literal is reported only when that literal names a command shell or a
        fixed env or BusyBox wrapper that immediately invokes a shell, because
        the request data is then command text rather than a separate argument.
      limitations: >
        Does not provide interfile analysis and can miss field-mediated or
        otherwise unsupported intrafile flows. Other Spring binding
        annotations, including @RequestHeader, @CookieValue, @ModelAttribute,
        and @RequestPart, are not sources. Request data placed in an argument
        position after a fixed non-shell program is not reported, so argument
        injection against that program is out of scope. Shell programs are
        recognized by literal name, so a shell reached through a variable is
        not reported. Runtime and ProcessBuilder receiver names are matched as
        written rather than resolved, so application classes with the same API
        shape can produce findings. Taint returned through a helper method is
        followed only when the helper is defined in the same file.
      sanitizer_analysis:
        status: not-modeled
        reason: The remediation replaces the command sink with a fixed executable and validated arguments, which the rule recognizes as a shape rather than as a sanitizer call.
      license: MIT
      author: CRA Evidence
    languages: [java]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.getQueryString()
          - patterns:
              - pattern-either:
                  - pattern: |
                      $RET $M(..., @RequestParam(...) $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @RequestParam $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @PathVariable(...) $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @PathVariable $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @RequestBody $T $X, ...) { ... }
              - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($CMD, ...)
              - pattern: new ProcessBuilder($CMD)
          - pattern-not: new ProcessBuilder(List.of("...", ...))
          - pattern-not: new ProcessBuilder(java.util.List.of("...", ...))
          - pattern-not: new ProcessBuilder(Arrays.asList("...", ...))
          - pattern-not: new ProcessBuilder(java.util.Arrays.asList("...", ...))
          - pattern-not: new ProcessBuilder(new String[] {"...", ...})
          - pattern-not: Runtime.getRuntime().exec(new String[] {"...", ...}, ...)
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder(List.of($PROGRAM, ...))
              - pattern: new ProcessBuilder(java.util.List.of($PROGRAM, ...))
              - pattern: new ProcessBuilder(Arrays.asList($PROGRAM, ...))
              - pattern: new ProcessBuilder(java.util.Arrays.asList($PROGRAM, ...))
              - pattern: new ProcessBuilder(new String[] {$PROGRAM, ...})
              - pattern: Runtime.getRuntime().exec(new String[] {$PROGRAM, ...}, ...)
          - metavariable-regex:
              metavariable: $PROGRAM
              regex: '(?i)^"(?:[A-Za-z]:)?(?:[\\/A-Za-z0-9_.-]*[\\/])?(?:sh|bash|zsh|ksh|dash|csh|tcsh|fish|cmd|powershell|pwsh)(?:\.exe)?"$'
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder($PROGRAM, $SWITCH, $CMD, ...)
              - pattern: new java.lang.ProcessBuilder($PROGRAM, $SWITCH, $CMD, ...)
          - metavariable-regex:
              metavariable: $PROGRAM
              regex: '(?i)^"(?:[A-Za-z]:)?(?:[\\/A-Za-z0-9_.-]*[\\/])?(?:sh|bash|zsh|ksh|dash|csh|tcsh|fish|cmd|powershell|pwsh)(?:\.exe)?"$'
          - metavariable-regex:
              metavariable: $SWITCH
              regex: '(?i)^"(?:-c|-command|/c)"$'
          - focus-metavariable: $CMD
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder(List.of($WRAPPER, $SHELL, $SWITCH, $CMD, ...))
              - pattern: new ProcessBuilder(java.util.List.of($WRAPPER, $SHELL, $SWITCH, $CMD, ...))
              - pattern: new ProcessBuilder(Arrays.asList($WRAPPER, $SHELL, $SWITCH, $CMD, ...))
              - pattern: new ProcessBuilder(java.util.Arrays.asList($WRAPPER, $SHELL, $SWITCH, $CMD, ...))
              - pattern: new ProcessBuilder(new String[] {$WRAPPER, $SHELL, $SWITCH, $CMD, ...})
              - pattern: Runtime.getRuntime().exec(new String[] {$WRAPPER, $SHELL, $SWITCH, $CMD, ...}, ...)
          - metavariable-regex:
              metavariable: $WRAPPER
              regex: '(?i)^"(?:[A-Za-z]:)?(?:[\\/A-Za-z0-9_.-]*[\\/])?(?:env|busybox)(?:\.exe)?"$'
          - metavariable-regex:
              metavariable: $SHELL
              regex: '(?i)^"(?:sh|bash|zsh|ksh|dash|csh|tcsh|fish|cmd|powershell|pwsh)(?:\.exe)?"$'
          - metavariable-regex:
              metavariable: $SWITCH
              regex: '(?i)^"(?:-c|-command|/c)"$'
          - focus-metavariable: $CMD
