rules:
  - id: cra-java-runtime-exec-request
    message: >
      HTTP request data reaches an operating system command. Pass a fixed
      executable and validated arguments without invoking a command shell.
    severity: ERROR
    metadata:
      tier: default
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology: [java, servlet]
      confidence: HIGH
      scope: >
        Detects request data reaching Runtime.exec or a single-argument
        ProcessBuilder constructor through flows supported within one file.
        Request data is servlet getParameter, getHeader, and getQueryString,
        plus Spring handler parameters annotated @RequestParam, @PathVariable,
        or @RequestBody. A command sequence whose first element is a string
        literal is reported only when that literal names a command shell,
        because the program is then fixed and the request data is command text
        rather than an argument.
      limitations: >
        Does not provide interfile analysis and can miss field-mediated or
        otherwise unsupported intrafile flows. Other Spring binding
        annotations, including @RequestHeader, @CookieValue, @ModelAttribute,
        and @RequestPart, are not sources. Request data placed in an argument
        position after a fixed non-shell program is not reported, so argument
        injection against that program is out of scope. Shell programs are
        recognized by literal name, so a shell reached through a variable or a
        multi-argument ProcessBuilder constructor is not reported.
      sanitizer_analysis:
        status: not-modeled
        reason: The remediation replaces the command sink with a fixed executable and validated arguments, which the rule recognizes as a shape rather than as a sanitizer call.
      license: MIT
      author: CRA Evidence
    languages: [java]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQ.getParameter(...)
          - pattern: $REQ.getHeader(...)
          - pattern: $REQ.getQueryString()
          - patterns:
              - pattern-either:
                  - pattern: |
                      $RET $M(..., @RequestParam(...) $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @RequestParam $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @PathVariable(...) $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @PathVariable $T $X, ...) { ... }
                  - pattern: |
                      $RET $M(..., @RequestBody $T $X, ...) { ... }
              - focus-metavariable: $X
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: Runtime.getRuntime().exec($CMD, ...)
              - pattern: new ProcessBuilder($CMD)
          - pattern-not: new ProcessBuilder(List.of("...", ...))
          - pattern-not: new ProcessBuilder(java.util.List.of("...", ...))
          - pattern-not: new ProcessBuilder(Arrays.asList("...", ...))
          - pattern-not: new ProcessBuilder(java.util.Arrays.asList("...", ...))
          - pattern-not: new ProcessBuilder(new String[] {"...", ...})
          - pattern-not: Runtime.getRuntime().exec(new String[] {"...", ...}, ...)
      - patterns:
          - pattern-either:
              - pattern: new ProcessBuilder(List.of($PROGRAM, ...))
              - pattern: new ProcessBuilder(java.util.List.of($PROGRAM, ...))
              - pattern: new ProcessBuilder(Arrays.asList($PROGRAM, ...))
              - pattern: new ProcessBuilder(java.util.Arrays.asList($PROGRAM, ...))
              - pattern: new ProcessBuilder(new String[] {$PROGRAM, ...})
              - pattern: Runtime.getRuntime().exec(new String[] {$PROGRAM, ...}, ...)
          - metavariable-regex:
              metavariable: $PROGRAM
              regex: '^"(?:[A-Za-z]:)?(?:[\\/A-Za-z0-9_.-]*[\\/])?(?:sh|bash|zsh|ksh|dash|csh|tcsh|fish|cmd|powershell|pwsh)(?:\.exe)?"$'
