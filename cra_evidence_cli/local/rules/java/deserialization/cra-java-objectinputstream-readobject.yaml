rules:
  - id: cra-java-objectinputstream-readobject
    message: >
      ObjectInputStream deserializes an object graph that can invoke code in
      available classes. Avoid native Java serialization for untrusted data and
      use a format with an explicit data contract.
    severity: WARNING
    metadata:
      tier: experimental
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/io/ObjectInputStream.html
      category: security
      technology: [java, serialization]
      confidence: VERY HIGH
      scope: >
        Detects readObject calls on a stream declared in the same method as
        ObjectInputStream or var and constructed with new ObjectInputStream,
        when that same stream has no earlier setObjectInputFilter call.
      limitations: >
        Does not prove that the stream is untrusted, so a stream reading data
        the application itself wrote is reported. Does not recognize filters
        configured through helpers, factories, other methods, a serial filter
        set process-wide, or a readObject override, and does not match a
        stream declared with a fully qualified type name or acquired through
        try-with-resources.
      license: MIT
      author: CRA Evidence
    languages: [java]
    patterns:
      - pattern: $STREAM.readObject()
      - pattern-not-inside: |
          $STREAM.setObjectInputFilter(...);
          ...
      - pattern-either:
          - pattern-inside: |
              ObjectInputStream $STREAM = new ObjectInputStream(...);
              ...
          - pattern-inside: |
              var $STREAM = new ObjectInputStream(...);
              ...
