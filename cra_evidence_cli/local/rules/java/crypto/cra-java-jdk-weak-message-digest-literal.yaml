rules:
  - id: cra-java-jdk-weak-message-digest-literal
    message: >
      The resolved JDK MessageDigest API selects MD2, MD5, or SHA-1. Use
      SHA-256 or stronger for integrity, and a password-specific KDF for
      passwords.
    severity: WARNING
    metadata:
      tier: default
      semantic_evidence:
        required: true
        language: java
        policy: java.jdk-message-digest-get-instance
        candidate_range: result
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/328.html
        - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/java/security/MessageDigest.html
      category: security
      technology: [java, cryptography]
      confidence: HIGH
      scope: >
        Generates candidates for direct literal weak-algorithm calls to
        MessageDigest.getInstance. A candidate is emitted only when supplied
        compiler evidence resolves the method to the top-level
        java.security.MessageDigest type in the java.base module.
      limitations: >
        Requires an explicit evidence envelope from the build-script-free JDK
        compiler pre-pass. Any compiler error, missing or stale evidence, or
        ambiguous occurrence degrades coverage and cannot produce a finding.
        Constant and dynamically constructed algorithm names remain in the
        broader experimental rule.
      license: MIT
      author: CRA Evidence
    languages: [java]
    patterns:
      - pattern-either:
          - pattern: MessageDigest.getInstance($ALGORITHM)
          - pattern: MessageDigest.getInstance($ALGORITHM, ...)
          - pattern: java.security.MessageDigest.getInstance($ALGORITHM)
          - pattern: java.security.MessageDigest.getInstance($ALGORITHM, ...)
          - pattern: getInstance($ALGORITHM)
          - pattern: getInstance($ALGORITHM, ...)
      - pattern-either:
          - pattern-inside: |
              import java.security.MessageDigest;
              ...
          - pattern-inside: |
              import java.security.*;
              ...
          - pattern-inside: |
              import static java.security.MessageDigest.getInstance;
              ...
          - pattern-inside: java.security.MessageDigest.getInstance(...)
      - metavariable-regex:
          metavariable: $ALGORITHM
          regex: '^("(?i:MD2|MD5|SHA-?1|SHA|(?:OID\.)?1\.3\.14\.3\.2\.26|(?:OID\.)?1\.2\.840\.113549\.2\.[25])")$'
