rules:
  - id: cra-java-hostname-verifier-accept-all
    message: >
      This hostname verifier accepts every certificate hostname. Use the
      platform hostname verifier so TLS peers are matched to the requested host.
    severity: WARNING
    metadata:
      tier: experimental
      cwe: ["CWE-297: Improper Validation of Certificate with Host Mismatch"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/297.html
        - https://docs.oracle.com/en/java/javase/21/docs/api/java.base/javax/net/ssl/HostnameVerifier.html
      category: security
      technology: [java, tls]
      confidence: MEDIUM
      scope: >
        Detects a verifier that returns the literal value true for every host.
        Two shapes are reported: a lambda whose whole body is true, passed to
        setHostnameVerifier, setDefaultHostnameVerifier, or an OkHttp-style
        hostnameVerifier builder call; and a verify(String, SSLSession) method
        that ends in return true with no rejecting return or throw, declared
        in an anonymous HostnameVerifier or in a class whose only declared
        interface is HostnameVerifier.
      limitations: >
        A verify method that returns true only inside a branch is not
        reported. Does not evaluate
        helper-returned booleans, constant expressions, method references,
        block-bodied lambdas, or verifier behavior distributed across methods
        or files, and does not recognize accept-all verifiers supplied by a
        library, such as Apache HttpClient NoopHostnameVerifier. Interfaces and
        callback methods are matched as written rather than resolved, so an
        application interface named HostnameVerifier can produce a finding.
      license: MIT
      author: CRA Evidence
    languages: [java]
    pattern-either:
      - pattern: $CONNECTION.setHostnameVerifier(($HOST, $SESSION) -> true)
      - pattern: $CLIENT.hostnameVerifier(($HOST, $SESSION) -> true)
      - pattern: HttpsURLConnection.setDefaultHostnameVerifier(($HOST, $SESSION) -> true)
      - pattern: javax.net.ssl.HttpsURLConnection.setDefaultHostnameVerifier(($HOST, $SESSION) -> true)
      - patterns:
          - pattern-either:
              - pattern: |
                  public boolean verify(String $HOST, SSLSession $SESSION) {
                    ...
                    return true;
                  }
              - pattern: |
                  public boolean verify(String $HOST, javax.net.ssl.SSLSession $SESSION) {
                    ...
                    return true;
                  }
          - pattern-not: |
              public boolean verify(String $HOST, $TYPE $SESSION) {
                ...
                return false;
                ...
              }
          - pattern-not: |
              public boolean verify(String $HOST, $TYPE $SESSION) {
                ...
                throw $EXCEPTION;
                ...
              }
          - pattern-either:
              - pattern-inside: |
                  new HostnameVerifier() {
                    ...
                  }
              - pattern-inside: |
                  new javax.net.ssl.HostnameVerifier() {
                    ...
                  }
              - pattern-inside: |
                  class $CLASS implements HostnameVerifier {
                    ...
                  }
              - pattern-inside: |
                  class $CLASS implements javax.net.ssl.HostnameVerifier {
                    ...
                  }
