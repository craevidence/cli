rules:
  - id: cra-php-superglobal-password-md5
    message: >
      A submitted password is hashed with MD5 or SHA-1. Use password_hash with
      PASSWORD_ARGON2ID or PASSWORD_DEFAULT and verify with password_verify.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-916: Use of Password Hash With Insufficient Computational Effort"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/916.html
        - https://www.php.net/manual/en/function.password-hash.php
      category: security
      technology: [php, passwords, cryptography]
      confidence: VERY HIGH
      license: MIT
      author: CRA Evidence
    languages: [php]
    patterns:
      - pattern-either:
          - pattern: md5($_POST[$KEY])
          - pattern: sha1($_POST[$KEY])
          - pattern: md5($_REQUEST[$KEY])
          - pattern: sha1($_REQUEST[$KEY])
          - pattern: md5($_GET[$KEY])
          - pattern: sha1($_GET[$KEY])
      - metavariable-regex:
          metavariable: $KEY
          regex: '.*(?i:password|passwd|pwd).*'
