rules:
  - id: cra-php-sql-superglobal-taint
    message: >
      HTTP request data reaches a SQL query as query text. Use a prepared
      statement with placeholders and bind each untrusted value.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-89: Improper Neutralization of Special Elements used in an SQL Command"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://www.php.net/manual/en/pdo.prepare.php
      category: security
      technology: [php, pdo, mysqli]
      confidence: HIGH
      scope: >
        Covers PDO and mysqli query, exec and prepare, the legacy mysql_query
        extension removed in PHP 7, and pg_query. A query assembled in one
        function and executed in another is not followed.
      sanitizer_analysis:
        status: partially-modeled
        reason: >
          Suppressed: a value coerced to a number or a boolean by intval,
          floatval, doubleval, boolval, a cast, settype, arithmetic coercion,
          or filter_var validating or stripping to a number, and PDO quote,
          which adds the surrounding quotes itself. A value constrained to a
          number cannot carry SQL syntax.
          Deliberately NOT suppressed: mysql_real_escape_string,
          mysqli_real_escape_string and real_escape_string. Escaping only
          protects a value that is written inside quotes, and the rule cannot
          see whether it is. Modelling them was measured and withdrawn: it
          silenced 18 real injections of the shape
          "SELECT * FROM student where id=" . mysql_real_escape_string($v),
          where the value is unquoted and 1 OR 1=1 passes through untouched.
          Suppressing them raised precision by one tenth of a point and cost
          more than two points of recall.
      license: MIT
      author: CRA Evidence
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](HTTP_[A-Z_]+|PATH_INFO|QUERY_STRING|REQUEST_URI|PHP_AUTH_USER|PHP_AUTH_PW)["']$
    pattern-sanitizers:
      - pattern-either:
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: doubleval(...)
          - pattern: boolval(...)
          - pattern: (int)$VALUE
          - pattern: (integer)$VALUE
          - pattern: (float)$VALUE
          - pattern: (double)$VALUE
          - pattern: (bool)$VALUE
          - pattern: (boolean)$VALUE
          - pattern: $DB->quote(...)
          - patterns:
              - pattern: filter_var($VALUE, $FILTER, ...)
              - metavariable-regex:
                  metavariable: $FILTER
                  regex: ^FILTER_(VALIDATE_(INT|FLOAT|BOOLEAN|BOOL)|SANITIZE_NUMBER_(INT|FLOAT))$
      - patterns:
          - pattern-either:
              - pattern: $VALUE += 0
              - pattern: $VALUE += 0.0
              - pattern: $VALUE = $VALUE + 0
              - pattern: $VALUE = $VALUE + 0.0
          - focus-metavariable: $VALUE
        by-side-effect: true
      - patterns:
          - pattern: settype($VALUE, $TYPE)
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^["'](int|integer|float|double|bool|boolean)["']$
          - focus-metavariable: $VALUE
        by-side-effect: true
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: $DB->query($QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: $DB->exec($QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: $DB->prepare($QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: mysqli_query($DB, $QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: mysqli_real_query($DB, $QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: mysqli_multi_query($DB, $QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: mysql_query($QUERY, ...)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: pg_query($QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: pg_query($DB, $QUERY)
              - focus-metavariable: $QUERY
          - patterns:
              - pattern: mysqli_prepare($DB, $QUERY)
              - focus-metavariable: $QUERY
