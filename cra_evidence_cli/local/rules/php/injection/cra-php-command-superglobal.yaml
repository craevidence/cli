rules:
  - id: cra-php-command-superglobal
    message: >
      HTTP request data is passed directly to an operating system command.
      Avoid shell execution and validate against a strict allowlist.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://www.php.net/manual/en/function.exec.php
      category: security
      technology: [php]
      confidence: VERY HIGH
      sanitizer_analysis:
        status: partially-modeled
        reason: >
          Suppressed: escapeshellarg and escapeshellcmd, a numeric cast written
          as (int), (float) or (bool), settype to a numeric or boolean type,
          intval, floatval, doubleval and boolval, and filter_var validating as
          an integer, float or boolean, and filter_var stripping a value to a
          number with FILTER_SANITIZE_NUMBER_INT or FILTER_SANITIZE_NUMBER_FLOAT. A value constrained to a number or a
          boolean cannot carry shell metacharacters. Validation by regular
          expression is deliberately NOT suppressed, because a pattern that
          accepts everything is still a flaw and the rule cannot tell the two
          apart. An allowlist comparison is not suppressed either.
      license: MIT
      author: CRA Evidence
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](HTTP_[A-Z_]+|PATH_INFO|QUERY_STRING|REQUEST_URI|PHP_AUTH_USER|PHP_AUTH_PW)["']$
    pattern-sanitizers:
      - pattern-either:
          - pattern: escapeshellarg(...)
          - pattern: escapeshellcmd(...)
          - pattern: intval(...)
          - pattern: floatval(...)
          - pattern: doubleval(...)
          - pattern: boolval(...)
          - pattern: (int)$VALUE
          - pattern: (integer)$VALUE
          - pattern: (float)$VALUE
          - pattern: (double)$VALUE
          - pattern: (bool)$VALUE
          - pattern: (boolean)$VALUE
          - patterns:
              - pattern: filter_var($VALUE, $FILTER, ...)
              - metavariable-regex:
                  metavariable: $FILTER
                  regex: ^FILTER_(VALIDATE_(INT|FLOAT|BOOLEAN|BOOL)|SANITIZE_NUMBER_(INT|FLOAT))$
      - patterns:
          - pattern-either:
              - pattern: $VALUE += 0
              - pattern: $VALUE += 0.0
              - pattern: $VALUE = $VALUE + 0
              - pattern: $VALUE = $VALUE + 0.0
          - focus-metavariable: $VALUE
        by-side-effect: true
      - patterns:
          - pattern: settype($VALUE, $TYPE)
          - metavariable-regex:
              metavariable: $TYPE
              regex: ^["'](int|integer|float|double|bool|boolean)["']$
          - focus-metavariable: $VALUE
        by-side-effect: true
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: exec($COMMAND, ...)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: system($COMMAND, ...)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: shell_exec($COMMAND)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: passthru($COMMAND, ...)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: popen($COMMAND, ...)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: proc_open($COMMAND, ...)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: '`$COMMAND`'
              - focus-metavariable: $COMMAND
