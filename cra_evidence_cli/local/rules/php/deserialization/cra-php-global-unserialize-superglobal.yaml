rules:
  - id: cra-php-global-unserialize-superglobal
    message: >
      HTTP request data is passed to PHP's global unserialize function. Use a
      safe data format such as JSON and validate the decoded structure.
    severity: ERROR
    metadata:
      tier: default
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://www.php.net/manual/en/function.unserialize.php
        - https://www.php.net/manual/en/language.namespaces.fallback.php
      category: security
      technology: [php]
      confidence: VERY HIGH
      scope: >
        Reports a simple variable or indexed-variable argument tainted by an
        HTTP superglobal when it is passed as the first argument to the literal
        fully qualified PHP global function spelling \unserialize. Function
        name matching is case-insensitive, as it is in PHP.
      limitations: >
        Does not report unqualified, namespace-relative, imported-alias,
        dynamic-callable, multiline, concatenated, nested-call, property, or
        other complex argument forms. The broader unqualified review rule stays
        experimental because application namespaces can define a function with
        the same short name. Analysis is intraprocedural.
      sanitizer_analysis:
        status: not-modeled
        reason: >
          PHP's manual says not to pass untrusted input to unserialize,
          regardless of the allowed_classes option.
      license: MIT
      author: CRA Evidence
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](HTTP_[A-Z_]+|PATH_INFO|QUERY_STRING|REQUEST_URI|PHP_AUTH_USER|PHP_AUTH_PW)["']$
    pattern-sinks:
      - patterns:
          - pattern-regex: '(?i)(?:^|[^A-Za-z0-9_\\])\\unserialize\s*\(\s*(?P<ARG>\$[A-Za-z_][A-Za-z0-9_]*(?:\[[^\]\r\n;]+\])*)'
          - focus-metavariable: $ARG
