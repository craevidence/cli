rules:
  - id: cra-php-unserialize-superglobal
    message: >
      HTTP request data is passed directly to unserialize(). Use JSON for
      untrusted data or enforce a safe schema without object deserialization.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://www.php.net/manual/en/function.unserialize.php
      category: security
      technology: [php]
      confidence: VERY HIGH
      scope: >
        Reviews unqualified unserialize calls receiving HTTP request data.
      limitations: >
        Inside a namespace, an unqualified call can resolve to an
        application-defined function with the same name. This broader rule
        therefore remains experimental. The separate default rule covers only
        PHP's literal fully qualified global function spelling.
      sanitizer_analysis:
        status: not-modeled
        reason: Untrusted serialized PHP objects have no generally safe sanitizer before deserialization.
      license: MIT
      author: CRA Evidence
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
          - patterns:
              - pattern: $_SERVER[$KEY]
              - metavariable-regex:
                  metavariable: $KEY
                  regex: ^["'](HTTP_[A-Z_]+|PATH_INFO|QUERY_STRING|REQUEST_URI|PHP_AUTH_USER|PHP_AUTH_PW)["']$
    pattern-sinks:
      - patterns:
          - pattern: unserialize($VALUE, ...)
          - focus-metavariable: $VALUE
