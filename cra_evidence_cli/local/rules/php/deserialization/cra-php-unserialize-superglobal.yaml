rules:
  - id: cra-php-unserialize-superglobal
    message: >
      HTTP request data is passed directly to unserialize(). Use JSON for
      untrusted data or enforce a safe schema without object deserialization.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://www.php.net/manual/en/function.unserialize.php
      category: security
      technology: [php]
      confidence: VERY HIGH
      sanitizer_analysis:
        status: not-modeled
        reason: Untrusted serialized PHP objects have no generally safe sanitizer before deserialization.
      license: MIT
      author: CRA Evidence
    languages: [php]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $_GET
          - pattern: $_POST
          - pattern: $_REQUEST
          - pattern: $_COOKIE
    pattern-sinks:
      - patterns:
          - pattern: unserialize($VALUE, ...)
          - focus-metavariable: $VALUE
