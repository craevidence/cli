rules:
  - id: cra-javascript-exec-injection
    message: >
      child_process exec() or execSync() called with a command string built by
      concatenation. If any part of the string comes from untrusted input this
      allows OS command injection. Use execFile() or spawn() with an argument
      array instead.
    severity: ERROR
    metadata:
      tier: experimental
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology:
        - javascript
      confidence: MEDIUM
      license: MIT
      author: CRA Evidence
    languages: [javascript, typescript]
    pattern-either:
      - patterns:
          - pattern-either:
              - pattern: $CP.exec($A + $B, ...)
              - pattern: $CP.execSync($A + $B, ...)
              - pattern: $CP.exec(`...${$VALUE}...`, ...)
              - pattern: $CP.execSync(`...${$VALUE}...`, ...)
          - pattern-either:
              - pattern-inside: |
                  const $CP = require("child_process");
                  ...
              - pattern-inside: |
                  var $CP = require("child_process");
                  ...
              - pattern-inside: |
                  let $CP = require("child_process");
                  ...
              - pattern-inside: |
                  const $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  var $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  let $CP = require("node:child_process");
                  ...
              - pattern-inside: |
                  import $CP from "child_process";
                  ...
              - pattern-inside: |
                  import $CP from "node:child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "child_process";
                  ...
              - pattern-inside: |
                  import * as $CP from "node:child_process";
                  ...
      - pattern: require('child_process').exec($A + $B, ...)
      - pattern: require('child_process').execSync($A + $B, ...)
      - pattern: require('child_process').exec(`...${$VALUE}...`, ...)
      - pattern: require('child_process').execSync(`...${$VALUE}...`, ...)
      - pattern: require('node:child_process').exec($A + $B, ...)
      - pattern: require('node:child_process').execSync($A + $B, ...)
      - pattern: require('node:child_process').exec(`...${$VALUE}...`, ...)
      - pattern: require('node:child_process').execSync(`...${$VALUE}...`, ...)
      - patterns:
          - pattern-either:
              - pattern: exec($A + $B, ...)
              - pattern: execSync($A + $B, ...)
              - pattern: exec(`...${$VALUE}...`, ...)
              - pattern: execSync(`...${$VALUE}...`, ...)
          - pattern-either:
              - pattern-inside: |
                  import { exec } from "child_process";
                  ...
              - pattern-inside: |
                  import { exec } from "node:child_process";
                  ...
              - pattern-inside: |
                  import { execSync } from "child_process";
                  ...
              - pattern-inside: |
                  import { execSync } from "node:child_process";
                  ...
              - pattern-inside: |
                  const { exec, execSync } = require("child_process");
                  ...
              - pattern-inside: |
                  var { exec, execSync } = require("child_process");
                  ...
              - pattern-inside: |
                  let { exec, execSync } = require("child_process");
                  ...
              - pattern-inside: |
                  const { exec, execSync } = require("node:child_process");
                  ...
              - pattern-inside: |
                  var { exec, execSync } = require("node:child_process");
                  ...
              - pattern-inside: |
                  let { exec, execSync } = require("node:child_process");
                  ...
              - pattern-inside: |
                  import { exec, execSync } from "child_process";
                  ...
              - pattern-inside: |
                  import { exec, execSync } from "node:child_process";
                  ...
      - patterns:
          - pattern-either:
              - pattern: $EXEC($A + $B, ...)
              - pattern: $EXEC(`...${$VALUE}...`, ...)
          - pattern-either:
              - pattern-inside: |
                  $EXEC = require("child_process").exec;
                  ...
              - pattern-inside: |
                  $EXEC = require("node:child_process").exec;
                  ...
              - pattern-inside: |
                  $EXEC = require("child_process").execSync;
                  ...
              - pattern-inside: |
                  $EXEC = require("node:child_process").execSync;
                  ...
              - pattern-inside: |
                  const { exec: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  var { exec: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  let { exec: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  const { exec: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  var { exec: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  let { exec: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  const { execSync: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  var { execSync: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  let { execSync: $EXEC } = require("child_process");
                  ...
              - pattern-inside: |
                  const { execSync: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  var { execSync: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  let { execSync: $EXEC } = require("node:child_process");
                  ...
              - pattern-inside: |
                  import { exec as $EXEC } from "child_process";
                  ...
              - pattern-inside: |
                  import { exec as $EXEC } from "node:child_process";
                  ...
              - pattern-inside: |
                  import { execSync as $EXEC } from "child_process";
                  ...
              - pattern-inside: |
                  import { execSync as $EXEC } from "node:child_process";
                  ...
