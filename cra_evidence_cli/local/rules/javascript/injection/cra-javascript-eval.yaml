rules:
  - id: cra-javascript-eval
    message: >
      eval() executes the string it receives as JavaScript. Review whether the
      value can contain untrusted input. Avoid eval(); use JSON.parse() for data,
      or structured alternatives for dynamic dispatch.
    severity: WARNING
    metadata:
      tier: experimental
      cwe:
        - "CWE-95: Improper Neutralization of Directives in Dynamically Evaluated Code"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/95.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology:
        - javascript
      confidence: MEDIUM
      scope: >
        Reports a call to eval. The argument is not examined, so the finding
        states that eval is used rather than that untrusted data reaches it.
      limitations: >
        A program that evaluates a string it generated itself is reported the
        same as one that evaluates request data. That is not a defect that can
        be narrowed away: every pattern that suppresses eval of a variable also
        suppresses eval of untrusted input, which is the whole value of the
        rule. This is why it stays opt-in. The member form, for example
        $scope.$eval, is not matched, confirmed by probe.
      license: MIT
      author: CRA Evidence
    languages: [javascript, typescript]
    pattern: eval(...)
