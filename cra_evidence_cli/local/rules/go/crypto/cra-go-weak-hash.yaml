rules:
  - id: cra-go-weak-hash
    message: >
      MD5 or SHA-1 is used. Review whether the digest protects a security
      property. These algorithms are unsuitable for signatures, MACs, password
      hashing, or collision resistance, but non-security checksums may be
      intentional. Use SHA-256 or stronger for security-sensitive hashing.
    severity: WARNING
    metadata:
      tier: experimental
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
      category: security
      technology:
        - go
      confidence: MEDIUM
      limitations: >
        Matches the qualified package calls only. A file that dot-imports
        crypto/md5 or crypto/sha1 and calls New() or Sum() without a qualifier
        is not matched.
      license: MIT
      author: CRA Evidence
    languages: [go]
    pattern-either:
      - pattern: md5.New()
      - pattern: md5.Sum(...)
      - pattern: sha1.New()
      - pattern: sha1.Sum(...)
