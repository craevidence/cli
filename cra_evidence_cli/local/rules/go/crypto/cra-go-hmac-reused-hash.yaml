rules:
  - id: cra-go-hmac-reused-hash
    message: >
      hmac.New() receives a function that returns an existing hash instance
      rather than creating a fresh one on each call. hmac.New calls that
      function twice and needs the two results to be distinct. Since Go 1.16 it
      compares them and panics with "hash generation function does not produce
      unique values", so a shared instance of a comparable hash type stops the
      program at this call. When the hash type is not comparable the comparison
      itself panics, hmac.New recovers from it and continues, and the two halves
      of the HMAC then share one state, which produces wrong output on any reuse
      of the returned value. Pass a constructor such as sha256.New.
    severity: ERROR
    metadata:
      tier: experimental
      cwe:
        - "CWE-327: Use of a Broken or Risky Cryptographic Algorithm"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/327.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://pkg.go.dev/crypto/hmac#New
      category: security
      technology:
        - go
      confidence: HIGH
      scope: >
        Reports a call to hmac.New whose generator is a function literal
        returning a value that already exists, in three shapes: a hash built by
        a New call and returned through a named function variable, the same hash
        returned by an inline literal, and an inline literal returning an
        expression whose type is hash.Hash.
      limitations: >
        A generator declared as a package-level or method function rather than a
        function literal is not matched, and neither is a shared hash reached
        through a struct field or a constructor other than a New call. The two
        shapes keyed on a New call describe code that panics at hmac.New on
        every standard library hash, because those hashes are pointer types and
        so comparable, which makes them a crash rather than a silent
        cryptographic weakness. The shape keyed on the hash.Hash type is the one
        that also covers a non-comparable hash, where the program keeps running
        on shared state.
      license: MIT
      author: CRA Evidence
      origin: dgryski/semgrep-go rule hmac-needs-new, MIT
    languages: [go]
    pattern-either:
      - pattern: |
          $H := $HASH.New()
          ...
          $FUNC := func() hash.Hash { return $H }
          ...
          hmac.New($FUNC, ...)
      - pattern: |
          $H := $HASH.New()
          ...
          hmac.New(func() hash.Hash { return $H }, ...)
      - pattern: |
          hmac.New(func() hash.Hash { return ($H : hash.Hash) }, ...)
