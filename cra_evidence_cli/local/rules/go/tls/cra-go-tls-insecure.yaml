rules:
  - id: cra-go-tls-insecure
    message: >
      InsecureSkipVerify is set to true, either in a tls.Config literal or by
      assignment to the field on a tls.Config value or pointer. Certificate
      chain and hostname verification are off, so a person-in-the-middle can
      intercept or modify traffic without detection. Remove InsecureSkipVerify
      or set it to false. A custom VerifyPeerCertificate or VerifyConnection
      callback still requires review because its presence alone does not prove
      that it performs certificate or hostname verification.
    severity: ERROR
    metadata:
      tier: experimental
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://pkg.go.dev/crypto/tls#Config
      category: security
      technology:
        - go
      confidence: HIGH
      scope: >
        Reports the literal true assigned to InsecureSkipVerify, either as a
        field in a tls.Config composite literal or as an assignment to the field
        on a receiver whose written type is tls.Config or *tls.Config. A
        custom VerifyPeerCertificate or VerifyConnection callback does not
        suppress the finding because the rule cannot establish what that
        callback checks. Direct import-bound Dial and DialWithDialer calls with
        no callback have a separate default rule.
      limitations: >
        Only the literal true is matched, so a value supplied through a
        variable, a constant, or an expression is not resolved. The assignment
        form needs the receiver to carry a tls.Config type in the scanned file,
        so a receiver typed only by a call result or by a declaration in another
        file is not matched. Package names are matched as written rather than
        resolved to an import path, so a package named tls that declares its own
        Config type with an InsecureSkipVerify field is generally reported by
        the composite and assignment forms. Direct inline Dial and
        DialWithDialer calls without callbacks are excluded for the import-bound
        default rule, so an application-package homonym in that exact shape is
        silent. A
        VerifyPeerCertificate or VerifyConnection callback may perform a
        complete replacement check, but callback behavior is not evaluated, so
        that configuration is still reported for review.
        A configuration guarded by a flag whose name signals a deliberate opt
        out, such as an insecure or self signed option, is still reported. Some
        analysers suppress those by reading intent from the identifier name;
        this rule does not, because verification is off either way and the
        decision is worth confirming rather than assuming.
      license: MIT
      author: CRA Evidence
    languages: [go]
    patterns:
      - pattern-either:
          # Direct crypto/tls Dial calls with no callback are handled by the
          # import-bound default rule. Callback-bearing calls stay here because
          # this rule cannot establish what the callback verifies.
          - patterns:
              - pattern: "tls.Dial(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
              - pattern: "tls.Dial(..., &tls.Config{..., VerifyConnection: $VERIFY, ...})"
          - patterns:
              - pattern: "tls.Dial(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
              - pattern: "tls.Dial(..., &tls.Config{..., VerifyPeerCertificate: $VERIFY, ...})"
          - patterns:
              - pattern: "tls.DialWithDialer(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
              - pattern: "tls.DialWithDialer(..., &tls.Config{..., VerifyConnection: $VERIFY, ...})"
          - patterns:
              - pattern: "tls.DialWithDialer(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
              - pattern: "tls.DialWithDialer(..., &tls.Config{..., VerifyPeerCertificate: $VERIFY, ...})"
          - patterns:
              - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
              - pattern-not-inside: "tls.Dial(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
              - pattern-not-inside: "tls.DialWithDialer(..., &tls.Config{..., InsecureSkipVerify: true, ...})"
          # InsecureSkipVerify is not a name reserved to crypto/tls, so the bare
          # assignment form is tied to a receiver whose type resolves to
          # tls.Config. Matching the field name on its own reported any struct
          # declaring a field of that name.
          - patterns:
              - pattern: "$CONF.InsecureSkipVerify = true"
              - metavariable-type:
                  metavariable: $CONF
                  types:
                    - tls.Config
                    - "*tls.Config"
