rules:
  - id: cra-go-tls-insecure
    message: >
      InsecureSkipVerify is set to true, either in a tls.Config literal or by
      assignment to the field on a tls.Config value or pointer. Certificate
      chain and hostname verification are off, so a person-in-the-middle can
      intercept or modify traffic without detection. Remove InsecureSkipVerify
      or set it to false. A configuration that also installs a
      VerifyPeerCertificate or VerifyConnection callback is not reported,
      because that callback replaces the standard check.
    severity: ERROR
    metadata:
      tier: default
      cwe:
        - "CWE-295: Improper Certificate Validation"
      owasp:
        - "A02:2021 - Cryptographic Failures"
      references:
        - https://cwe.mitre.org/data/definitions/295.html
        - https://owasp.org/Top10/A02_2021-Cryptographic_Failures/
        - https://pkg.go.dev/crypto/tls#Config
      category: security
      technology:
        - go
      confidence: HIGH
      scope: >
        Reports the literal true assigned to InsecureSkipVerify, either as a
        field in a tls.Config composite literal or as an assignment to the field
        on a receiver whose written type is tls.Config or *tls.Config. The
        finding is withheld when the same configuration also sets
        VerifyPeerCertificate or VerifyConnection, either in the same literal or
        on the same variable later in the function, because those callbacks
        carry the verification the standard check would have done.
      limitations: >
        Only the literal true is matched, so a value supplied through a
        variable, a constant, or an expression is not resolved. The assignment
        form needs the receiver to carry a tls.Config type in the scanned file,
        so a receiver typed only by a call result or by a declaration in another
        file is not matched. Package names are matched as written rather than
        resolved to an import path, so a package named tls that declares its own
        Config type with an InsecureSkipVerify field is reported. A
        VerifyPeerCertificate or VerifyConnection callback installed in a
        different function or file is not seen, and a callback that does no real
        checking suppresses the finding just as a complete one does.
        A configuration guarded by a flag whose name signals a deliberate opt
        out, such as an insecure or self signed option, is still reported. Some
        analysers suppress those by reading intent from the identifier name;
        this rule does not, because verification is off either way and the
        decision is worth confirming rather than assuming.
      license: MIT
      author: CRA Evidence
    languages: [go]
    patterns:
      - pattern-either:
          - pattern: "tls.Config{..., InsecureSkipVerify: true, ...}"
          # InsecureSkipVerify is not a name reserved to crypto/tls, so the bare
          # assignment form is tied to a receiver whose type resolves to
          # tls.Config. Matching the field name on its own reported any struct
          # declaring a field of that name.
          - patterns:
              - pattern: "$CONF.InsecureSkipVerify = true"
              - metavariable-type:
                  metavariable: $CONF
                  types:
                    - tls.Config
                    - "*tls.Config"
      # A configuration that supplies its own certificate check is not running
      # without verification, so the message above would not be true of it.
      - pattern-not: "tls.Config{..., InsecureSkipVerify: true, ..., VerifyPeerCertificate: $F, ...}"
      - pattern-not: "tls.Config{..., InsecureSkipVerify: true, ..., VerifyConnection: $F, ...}"
      - pattern-not-inside: |
          $CFG.InsecureSkipVerify = true
          ...
          $CFG.VerifyPeerCertificate = $F
      - pattern-not-inside: |
          $CFG.InsecureSkipVerify = true
          ...
          $CFG.VerifyConnection = $F
      - pattern-not-inside: |
          $CFG = &tls.Config{..., InsecureSkipVerify: true, ...}
          ...
          $CFG.VerifyPeerCertificate = $F
      - pattern-not-inside: |
          $CFG = &tls.Config{..., InsecureSkipVerify: true, ...}
          ...
          $CFG.VerifyConnection = $F
