rules:
  - id: cra-csharp-weak-hash
    message: >
      MD5 and SHA-1 are collision-prone message digests. Use SHA-256 or a
      stronger digest for integrity, and a password-specific KDF for passwords.
    severity: WARNING
    metadata:
      tier: experimental
      cwe: ["CWE-328: Use of Weak Hash"]
      owasp: ["A02:2021 - Cryptographic Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/328.html
        - https://learn.microsoft.com/en-us/dotnet/standard/security/cryptographic-services
        - https://learn.microsoft.com/en-us/dotnet/api/system.security.cryptography.md5.hashdata
      category: security
      technology: [csharp, dotnet, cryptography]
      confidence: MEDIUM
      scope: >
        Detects SHA-1 Create calls, MD5 and SHA-1 one-shot hashing calls,
        direct weak-hash construction, and literal weak algorithm names passed
        to HashAlgorithm.Create. MD5.Create calls are handled by the separate
        semantic-evidence candidate.
      limitations: >
        Does not flag HMAC constructions such as HMACMD5, whose security
        properties differ from those of a bare digest, and does not resolve
        algorithm names built at runtime or read from configuration. Simple
        type names are matched as written, so application classes named MD5,
        SHA1, or HashAlgorithm with the same methods are also reported. This
        broad review rule remains experimental.
      license: MIT
      author: CRA Evidence
    languages: [csharp]
    pattern-either:
      - pattern: SHA1.Create()
      - pattern: SHA1Managed.Create()
      - pattern: System.Security.Cryptography.SHA1.Create()
      - pattern: MD5.HashData(...)
      - pattern: SHA1.HashData(...)
      - pattern: MD5.TryHashData(...)
      - pattern: SHA1.TryHashData(...)
      - pattern: MD5.HashDataAsync(...)
      - pattern: SHA1.HashDataAsync(...)
      - pattern: System.Security.Cryptography.MD5.HashData(...)
      - pattern: System.Security.Cryptography.SHA1.HashData(...)
      - pattern: new MD5CryptoServiceProvider(...)
      - pattern: new SHA1CryptoServiceProvider(...)
      - pattern: new SHA1Managed(...)
      - pattern: new MD5Cng(...)
      - pattern: new SHA1Cng(...)
      - pattern: new System.Security.Cryptography.MD5CryptoServiceProvider(...)
      - pattern: new System.Security.Cryptography.SHA1CryptoServiceProvider(...)
      - pattern: new System.Security.Cryptography.SHA1Managed(...)
      - pattern: HashAlgorithm.Create("MD5")
      - pattern: HashAlgorithm.Create("SHA1")
      - pattern: HashAlgorithm.Create("SHA-1")
      - pattern: System.Security.Cryptography.HashAlgorithm.Create("MD5")
      - pattern: System.Security.Cryptography.HashAlgorithm.Create("SHA1")
      - pattern: System.Security.Cryptography.HashAlgorithm.Create("SHA-1")
