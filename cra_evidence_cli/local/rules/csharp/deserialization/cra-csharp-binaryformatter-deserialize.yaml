rules:
  - id: cra-csharp-binaryformatter-deserialize
    message: >
      BinaryFormatter deserialization is unsafe and cannot be made secure.
      Replace it with a serializer that enforces an explicit data contract.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-502: Deserialization of Untrusted Data"]
      owasp: ["A08:2021 - Software and Data Integrity Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://learn.microsoft.com/en-us/dotnet/standard/serialization/binaryformatter-security-guide
      category: security
      technology: [csharp, dotnet]
      confidence: MEDIUM
      scope: >
        Detects a Deserialize call on a BinaryFormatter that is constructed
        inline or assigned to a local in the same function, including the
        target-typed new and object initializer spellings.
      limitations: >
        Does not track formatters held in fields or received as parameters, and
        does not follow deserialization across files. Type names are matched as
        written rather than resolved, so an application class named
        BinaryFormatter is also reported.
      license: MIT
      author: CRA Evidence
    languages: [csharp]
    pattern-either:
      - pattern: new BinaryFormatter(...).Deserialize(...)
      - pattern: new BinaryFormatter(...) { ... }.Deserialize(...)
      - pattern: new System.Runtime.Serialization.Formatters.Binary.BinaryFormatter(...).Deserialize(...)
      - pattern: new System.Runtime.Serialization.Formatters.Binary.BinaryFormatter(...) { ... }.Deserialize(...)
      - patterns:
          - pattern: $FORMATTER.Deserialize(...)
          - pattern-either:
              - pattern-inside: |
                  BinaryFormatter $FORMATTER = new BinaryFormatter(...) { ... };
                  ...
              - pattern-inside: |
                  var $FORMATTER = new BinaryFormatter(...) { ... };
                  ...
              - pattern-inside: |
                  BinaryFormatter $FORMATTER = new(...) { ... };
                  ...
