rules:
  - id: cra-csharp-process-request-taint
    message: >
      HTTP request data reaches a command interpreter. Launch a fixed executable
      directly and pass validated values through ArgumentList without a shell.
    severity: ERROR
    metadata:
      tier: default
      cwe: ["CWE-78: Improper Neutralization of Special Elements used in an OS Command"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://learn.microsoft.com/en-us/dotnet/api/system.diagnostics.processstartinfo.argumentlist
      category: security
      technology: [csharp, dotnet, aspnet]
      confidence: HIGH
      scope: >
        Tracks ASP.NET Core request collections, System.Web QueryString, Params,
        Form, Headers and Cookies reads, and [FromQuery], [FromBody] and
        [FromRoute] parameters into Process.Start and ProcessStartInfo command
        text and arguments. Params and Cookies reads require a receiver named
        req or Request so that an application type with the same property name
        is not treated as request data.
      limitations: >
        Taint is followed within a single file. Flows that cross a method
        boundary through a field, a helper class, or another file are not
        reported.
      sanitizer_analysis:
        status: modeled
        reason: A fixed executable with ArgumentList is modeled as a non-shell process invocation.
      license: MIT
      author: CRA Evidence
    languages: [csharp]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: $REQUEST.Query[$KEY]
          - pattern: $REQUEST.Form[$KEY]
          - pattern: $REQUEST.Headers[$KEY]
          - pattern: $REQUEST.QueryString[$KEY]
          - pattern: $REQUEST.QueryString.Get($KEY)
          - pattern: $REQUEST.Form.Get($KEY)
          - pattern: $REQUEST.Headers.Get($KEY)
          - patterns:
              - pattern-either:
                  - pattern: $REQUEST.Params[$KEY]
                  - pattern: $REQUEST.Params.Get($KEY)
                  - pattern: $REQUEST.Cookies
              - metavariable-regex:
                  metavariable: $REQUEST
                  regex: '(?i)^([\w.]+\.)?(req|request)$'
          - patterns:
              - pattern-inside: |
                  $RET $METHOD(..., [FromQuery] $TYPE $PARAM, ...) {
                    ...
                  }
              - focus-metavariable: $PARAM
          - patterns:
              - pattern-inside: |
                  $RET $METHOD(..., [FromBody] $TYPE $PARAM, ...) {
                    ...
                  }
              - focus-metavariable: $PARAM
          - patterns:
              - pattern-inside: |
                  $RET $METHOD(..., [FromRoute] $TYPE $PARAM, ...) {
                    ...
                  }
              - focus-metavariable: $PARAM
    pattern-sanitizers:
      - patterns:
          - pattern: new ProcessStartInfo { FileName = $EXECUTABLE, ArgumentList = { ... } }
          - metavariable-regex:
              metavariable: $EXECUTABLE
              regex: '(?i)^"(?!cmd(?:\.exe)?"$|powershell(?:\.exe)?"$|pwsh"$|/bin/sh"$|/bin/bash"$|sh"$|bash"$)[^"]+"$'
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: Process.Start($SHELL, $ARGUMENTS)
              - metavariable-regex:
                  metavariable: $SHELL
                  regex: '^("(?i:cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|/bin/sh|/bin/bash|sh|bash)")$'
              - focus-metavariable: $ARGUMENTS
          - patterns:
              - pattern: new ProcessStartInfo($SHELL, $ARGUMENTS)
              - metavariable-regex:
                  metavariable: $SHELL
                  regex: '^("(?i:cmd(?:\.exe)?|powershell(?:\.exe)?|pwsh|/bin/sh|/bin/bash|sh|bash)")$'
              - focus-metavariable: $ARGUMENTS
          - patterns:
              - pattern: Process.Start($COMMAND)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: new ProcessStartInfo($COMMAND)
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: new ProcessStartInfo(...) { FileName = $COMMAND, ... }
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: new ProcessStartInfo { FileName = $COMMAND, ... }
              - focus-metavariable: $COMMAND
          - patterns:
              - pattern: new ProcessStartInfo(...) { Arguments = $ARGUMENTS, ... }
              - focus-metavariable: $ARGUMENTS
          - patterns:
              - pattern: new ProcessStartInfo { ..., Arguments = $ARGUMENTS, ... }
              - focus-metavariable: $ARGUMENTS
