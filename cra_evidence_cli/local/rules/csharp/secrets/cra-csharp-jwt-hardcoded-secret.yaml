rules:
  - id: cra-csharp-jwt-hardcoded-secret
    message: >
      A symmetric JWT key is embedded in source code. Load the key from a
      protected secret store and rotate any exposed value.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://learn.microsoft.com/en-us/dotnet/api/microsoft.identitymodel.tokens.symmetricsecuritykey
      category: security
      technology: [csharp, dotnet, jwt]
      confidence: MEDIUM
      scope: >
        Detects a string literal converted to bytes and passed directly to a
        SymmetricSecurityKey constructor in the supported UTF-8 and ASCII
        spellings.
      limitations: >
        Does not follow constants, variables, helper calls, or other encodings.
        Simple type names are matched as written, so an application class named
        SymmetricSecurityKey with the same constructor shape is also reported.
      license: MIT
      author: CRA Evidence
    languages: [csharp]
    pattern-either:
      - pattern: new SymmetricSecurityKey(Encoding.UTF8.GetBytes("$SECRET"))
      - pattern: new SymmetricSecurityKey(Encoding.ASCII.GetBytes("$SECRET"))
      - pattern: new Microsoft.IdentityModel.Tokens.SymmetricSecurityKey(Encoding.UTF8.GetBytes("$SECRET"))
