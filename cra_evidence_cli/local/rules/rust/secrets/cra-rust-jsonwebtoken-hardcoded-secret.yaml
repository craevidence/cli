rules:
  - id: cra-rust-jsonwebtoken-hardcoded-secret
    message: >
      A JWT signing or verification key is embedded in source code. Load the key
      from a protected secret store and rotate any exposed value.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-798: Use of Hard-coded Credentials"]
      owasp: ["A07:2021 - Identification and Authentication Failures"]
      references:
        - https://cwe.mitre.org/data/definitions/798.html
        - https://docs.rs/jsonwebtoken/latest/jsonwebtoken/struct.EncodingKey.html
      category: security
      technology: [rust, jsonwebtoken, jwt]
      confidence: VERY HIGH
      license: MIT
      author: CRA Evidence
    languages: [rust]
    patterns:
      - pattern-either:
          - pattern: EncodingKey::from_secret(b"$SECRET")
          - pattern: DecodingKey::from_secret(b"$SECRET")
          - pattern: jsonwebtoken::EncodingKey::from_secret(b"$SECRET")
          - pattern: jsonwebtoken::DecodingKey::from_secret(b"$SECRET")
          - pattern: EncodingKey::from_base64_secret("$SECRET")
          - pattern: DecodingKey::from_base64_secret("$SECRET")
          - pattern: jsonwebtoken::EncodingKey::from_base64_secret("$SECRET")
          - pattern: jsonwebtoken::DecodingKey::from_base64_secret("$SECRET")
      - pattern-not-inside: |
          mod tests {
              ...
          }
      - pattern-not-inside: |
          mod test {
              ...
          }
