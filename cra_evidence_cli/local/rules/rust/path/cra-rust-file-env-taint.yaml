rules:
  - id: cra-rust-file-env-taint
    message: >
      Process input reaches a filesystem path. Resolve the value beneath a
      fixed base directory, canonicalize it, and reject paths outside the base.
    severity: ERROR
    metadata:
      tier: experimental
      cwe: ["CWE-22: Improper Limitation of a Pathname to a Restricted Directory"]
      owasp: ["A01:2021 - Broken Access Control"]
      references:
        - https://cwe.mitre.org/data/definitions/22.html
        - https://doc.rust-lang.org/std/fs/fn.canonicalize.html
      category: security
      technology: [rust, filesystem]
      confidence: HIGH
      sanitizer_analysis:
        status: not-modeled
        reason: >
          Containment is not suppressed. The engine cannot prove that the base
          is trusted or that a sink is reached only after a successful guard.
          Two modeled shapes were withdrawn after they silenced traversals with
          attacker-controlled or vacuous bases and sinks in an else branch.
          Correct canonicalize-and-contain code may therefore be reported for
          review.
      license: MIT
      author: CRA Evidence
    languages: [rust]
    mode: taint
    pattern-sources:
      - pattern-either:
          - pattern: std::env::args().nth(...)
          - pattern: std::env::var(...)
    pattern-sinks:
      - pattern-either:
          - patterns:
              - pattern: std::fs::read($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: std::fs::read_to_string($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: std::fs::File::open($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: tokio::fs::read($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: tokio::fs::read_to_string($PATH)
              - focus-metavariable: $PATH
          - patterns:
              - pattern: tokio::fs::File::open($PATH)
              - focus-metavariable: $PATH
