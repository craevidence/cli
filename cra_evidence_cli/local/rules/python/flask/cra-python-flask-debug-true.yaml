rules:
  - id: cra-python-flask-debug-true
    message: >
      Flask debug mode is enabled with a literal True. The interactive debugger
      exposes a console that can allow arbitrary code execution and should never be
      on in production. Drive debug mode from an environment variable or a
      per-environment config value that is False in production instead of
      hardcoding debug=True.
    severity: ERROR
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-489: Active Debug Code"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://flask.palletsprojects.com/en/stable/config/
        - https://cwe.mitre.org/data/definitions/489.html
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      category: security
      technology:
        - python
        - flask
      confidence: HIGH
      scope: >
        Covers app.run(debug=True), the config subscript, config.update(),
        config.from_mapping() in both keyword and dict form, the app.debug
        attribute, and DEBUG = True in the body of a config class that
        app.config.from_object() would load.
      limitations: >
        Config classes whose name starts with dev, development, test, testing,
        local, stage, staging, sandbox, debug, or qa are skipped, because debug
        mode is intended in those environments. Values read from a file by
        from_pyfile() or from_envvar() are outside the scanned file.
      license: MIT
      author: CRA Evidence
    pattern-either:
      - patterns:
          - pattern: $APP.run(..., debug=$DEBUG, ...)
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: $APP.config['DEBUG'] = $DEBUG
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: $APP.config.update(..., DEBUG=$DEBUG, ...)
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: '$APP.config.update({..., "DEBUG": $DEBUG, ...})'
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: $APP.config.from_mapping(..., DEBUG=$DEBUG, ...)
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: '$APP.config.from_mapping({..., "DEBUG": $DEBUG, ...})'
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern: $APP.debug = $DEBUG
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - focus-metavariable: $DEBUG
      - patterns:
          - pattern-inside: |
              class $C(...):
                  ...
          - pattern-not-inside: |
              def $F(...):
                  ...
          - pattern: DEBUG = $DEBUG
          - metavariable-pattern:
              metavariable: $DEBUG
              pattern: "True"
          - metavariable-regex:
              metavariable: $C
              regex: ^(?!(?i:dev|develop|development|test|testing|local|stage|staging|sandbox|debug|qa)([_A-Z]|$))
          - focus-metavariable: $DEBUG
