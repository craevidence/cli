rules:
  - id: cra-python-flask-hardcoded-secret-key
    message: >
      A hardcoded string or bytes literal is assigned to the Flask SECRET_KEY. A
      committed secret key can allow session cookie forgery and other signed-token
      tampering. Load SECRET_KEY from an environment variable or a secret store at
      runtime rather than embedding a literal that ends up in version control.
    severity: ERROR
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-798: Use of Hard-coded Credentials"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://flask.palletsprojects.com/en/stable/config/
        - https://cwe.mitre.org/data/definitions/798.html
        - https://owasp.org/Top10/A05_2021-Security_Misconfiguration/
      category: security
      technology:
        - python
        - flask
      confidence: HIGH
      scope: >
        Covers the config subscript, the secret_key attribute, config.update(),
        config.from_mapping() in both keyword and dict form, and
        SECRET_KEY = "literal" in the body of a config class that
        app.config.from_object() would load.
      limitations: >
        Config classes whose name starts with dev, development, test, testing,
        local, stage, staging, sandbox, debug, or qa are skipped, because a
        throwaway key in those classes is deliberate. Empty and blank literals
        are treated as placeholders. Values read from a file by from_pyfile()
        or from_envvar() are outside the scanned file.
      license: MIT
      author: CRA Evidence
    pattern-either:
      - patterns:
          - pattern: $APP.config['SECRET_KEY'] = $VAL
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern: $APP.secret_key = $VAL
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern: $APP.config.update(..., SECRET_KEY=$VAL, ...)
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern: '$APP.config.update({..., "SECRET_KEY": $VAL, ...})'
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern: $APP.config.from_mapping(..., SECRET_KEY=$VAL, ...)
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern: '$APP.config.from_mapping({..., "SECRET_KEY": $VAL, ...})'
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - focus-metavariable: $VAL
      - patterns:
          - pattern-inside: |
              class $C(...):
                  ...
          - pattern-not-inside: |
              def $F(...):
                  ...
          - pattern: SECRET_KEY = $VAL
          - metavariable-regex:
              metavariable: $VAL
              regex: ^([bBrRuU]|[bB][rR]|[rR][bB])?['"][^'"]*[^'"\s]
          - metavariable-regex:
              metavariable: $C
              regex: ^(?!(?i:dev|develop|development|test|testing|local|stage|staging|sandbox|debug|qa)([_A-Z]|$))
          - focus-metavariable: $VAL
