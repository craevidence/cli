rules:
  - id: cra-python-flask-session-cookie-insecure-false
    message: >
      A cookie is sent without the Secure attribute: either SESSION_COOKIE_SECURE is
      set to False, or a response cookie is set with secure=False. Without the Secure
      attribute the cookie can be transmitted over plaintext HTTP and captured by a
      network attacker. Set SESSION_COOKIE_SECURE to True and pass secure=True to
      set_cookie in any deployment served over HTTPS.
    severity: WARNING
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-614: Sensitive Cookie in HTTPS Session Without 'Secure' Attribute"
      owasp:
        - "A05:2021 - Security Misconfiguration"
      references:
        - https://flask.palletsprojects.com/en/stable/config/
        - https://cwe.mitre.org/data/definitions/614.html
        - https://owasp.org/www-community/controls/SecureCookieAttribute
      category: security
      technology:
        - python
        - flask
      confidence: HIGH
      license: MIT
      author: CRA Evidence
    pattern-either:
      - patterns:
          - pattern: $APP.config['SESSION_COOKIE_SECURE'] = $VAL
          - metavariable-pattern:
              metavariable: $VAL
              pattern: "False"
          - focus-metavariable: $VAL
      - patterns:
          - pattern: $APP.config.update(..., SESSION_COOKIE_SECURE=$VAL, ...)
          - metavariable-pattern:
              metavariable: $VAL
              pattern: "False"
          - focus-metavariable: $VAL
      - patterns:
          - pattern: $RESP.set_cookie(..., secure=$VAL, ...)
          - metavariable-pattern:
              metavariable: $VAL
              pattern: "False"
          - focus-metavariable: $VAL
