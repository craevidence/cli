rules:
  - id: cra-python-taint-subprocess-shell
    mode: taint
    message: >
      Untrusted input flows into a shell command through subprocess with
      shell=True, os.system(), or os.popen(). This allows OS command injection.
      Pass arguments as a list without a shell, or apply strict validation before
      constructing the command string.
    severity: ERROR
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-78: Improper Neutralization of Special Elements used in an OS Command"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/78.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology:
        - python
        - flask
      confidence: HIGH
      sanitizer_analysis:
        status: not-modeled
        reason: The remediation removes shell mode or applies application-specific validation before changing command structure.
      license: MIT
      author: CRA Evidence
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.headers.get(...)
      - pattern: request.cookies.get(...)
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.headers.get(...)
      - pattern: flask.request.cookies.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.values[...]
      - pattern: request.headers[...]
      - pattern: request.cookies[...]
      - pattern: flask.request.args[...]
      - pattern: flask.request.form[...]
      - pattern: flask.request.values[...]
      - pattern: flask.request.headers[...]
      - pattern: flask.request.cookies[...]
      - pattern: input(...)
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: subprocess.$FUNC($CMD, ..., shell=True, ...)
              - pattern: os.system($CMD)
              - pattern: os.popen($CMD, ...)
          - focus-metavariable: $CMD
