rules:
  - id: cra-python-taint-sql-inject
    mode: taint
    message: >
      Untrusted input reaches a SQL execute() call as part of the query string.
      This allows SQL injection. Use parameterized queries: pass values as a
      second argument to execute() rather than embedding them in the query string.
    severity: ERROR
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology:
        - python
        - flask
      confidence: HIGH
      sanitizer_analysis:
        status: not-modeled
        reason: Numeric conversion cannot be identified safely when Python names can be rebound; use parameterized queries.
      license: MIT
      author: CRA Evidence
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.headers.get(...)
      - pattern: request.cookies.get(...)
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.headers.get(...)
      - pattern: flask.request.cookies.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.values[...]
      - pattern: request.headers[...]
      - pattern: request.cookies[...]
      - pattern: flask.request.args[...]
      - pattern: flask.request.form[...]
      - pattern: flask.request.values[...]
      - pattern: flask.request.headers[...]
      - pattern: flask.request.cookies[...]
      - pattern: input(...)
    pattern-sinks:
      - patterns:
          - pattern: $CUR.execute($QUERY)
          - focus-metavariable: $QUERY
