rules:
  - id: cra-python-taint-sql-inject
    mode: taint
    message: >
      Untrusted input reaches a SQL query string that is handed to the database
      driver. This allows SQL injection. Use parameterized queries: keep the
      query text constant and pass values through the driver's parameter
      argument rather than embedding them in the query string.
    severity: ERROR
    languages: [python]
    metadata:
      tier: default
      cwe:
        - "CWE-89: Improper Neutralization of Special Elements used in an SQL Command"
      owasp:
        - "A03:2021 - Injection"
      references:
        - https://cwe.mitre.org/data/definitions/89.html
        - https://owasp.org/Top10/A03_2021-Injection/
      category: security
      technology:
        - python
        - flask
        - django
      confidence: HIGH
      scope: >
        Follows Flask request query, form, cookie, header, and body data, and
        values read from input(), into the query-text argument of execute,
        executemany, executescript, or a Django objects.raw call. Multi-value
        accessors such as args.getlist and the raw query_string are sources as
        well. Only the query text is a sink: a value passed through the driver's
        parameter argument is not reported, because the driver binds it rather
        than interpreting it as SQL.
      limitations: >
        Intrafile taint does not cross file boundaries, so a request value that a
        helper in another module returns is not reported. Taint is lost through a
        match statement and through string slicing, so a flow that passes either
        of those is missed. A value written into a configparser option is followed
        only when it is read back from the same section and option name.
      sanitizer_analysis:
        status: not-modeled
        reason: Numeric conversion cannot be identified safely when Python names can be rebound; use parameterized queries.
      license: MIT
      author: CRA Evidence
    pattern-sources:
      - pattern: request.args.get(...)
      - pattern: request.form.get(...)
      - pattern: request.values.get(...)
      - pattern: request.json
      - pattern: request.data
      - pattern: request.headers.get(...)
      - pattern: request.cookies.get(...)
      - pattern: flask.request.args.get(...)
      - pattern: flask.request.form.get(...)
      - pattern: flask.request.values.get(...)
      - pattern: flask.request.json
      - pattern: flask.request.data
      - pattern: flask.request.headers.get(...)
      - pattern: flask.request.cookies.get(...)
      - pattern: request.args[...]
      - pattern: request.form[...]
      - pattern: request.values[...]
      - pattern: request.headers[...]
      - pattern: request.cookies[...]
      - pattern: flask.request.args[...]
      - pattern: flask.request.form[...]
      - pattern: flask.request.values[...]
      - pattern: flask.request.headers[...]
      - pattern: flask.request.cookies[...]
      - pattern: request.args.getlist(...)
      - pattern: request.form.getlist(...)
      - pattern: request.values.getlist(...)
      - pattern: request.headers.getlist(...)
      - pattern: flask.request.args.getlist(...)
      - pattern: flask.request.form.getlist(...)
      - pattern: flask.request.values.getlist(...)
      - pattern: flask.request.headers.getlist(...)
      - pattern: request.query_string
      - pattern: flask.request.query_string
      - pattern: request.get_json(...)
      - pattern: flask.request.get_json(...)
      - pattern: input(...)
    pattern-propagators:
      # A value stored in a configparser option stays tainted when it is read
      # back from the same section and the same option name. Binding $SEC and
      # $K in both halves keeps a read of a different option untainted.
      - pattern: |
          $C.set($SEC, $K, $FROM)
          ...
          $TO = $C.get($SEC, $K, ...)
        from: $FROM
        to: $TO
    pattern-sinks:
      - patterns:
          - pattern-either:
              - pattern: $CUR.execute($QUERY, ...)
              - pattern: $CUR.executemany($QUERY, ...)
              - pattern: $CUR.executescript($QUERY)
              - pattern: $MODEL.objects.raw($QUERY, ...)
          - focus-metavariable: $QUERY
