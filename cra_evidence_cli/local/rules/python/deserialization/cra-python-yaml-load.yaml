rules:
  - id: cra-python-yaml-load
    message: >
      yaml.load() without a safe loader, or with Loader/UnsafeLoader, can
      deserialize arbitrary Python objects when given untrusted YAML input. Use
      yaml.safe_load() or pass Loader=yaml.SafeLoader.
    severity: WARNING
    metadata:
      tier: default
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
      category: security
      technology:
        - python
      confidence: HIGH
      scope: >
        Reports yaml.load with no Loader argument, yaml.load with Loader set to
        yaml.Loader or yaml.UnsafeLoader, and yaml.unsafe_load. Those loaders
        construct arbitrary Python objects, so the call itself is the finding
        and the rule does not try to establish where the document came from.
      limitations: >
        Because the origin of the document is not analysed, a call on YAML the
        application ships itself is reported the same way as a call on request
        data. A loader selected through a variable or a helper is not resolved,
        so yaml.load(text, Loader=chosen) is not reported.
      sanitizer_analysis:
        status: not-applicable
        reason: >
          The safe outcome is a different loader rather than a transformation of
          the input, and safe_load and SafeLoader are excluded by the patterns
          themselves. No construct applied to the document is treated as
          neutralising an unsafe loader.
      license: MIT
      author: CRA Evidence
    languages: [python]
    pattern-either:
      - pattern: yaml.load($X)
      - pattern: yaml.load($X, ..., Loader=yaml.Loader, ...)
      - pattern: yaml.load($X, ..., Loader=yaml.UnsafeLoader, ...)
      - pattern: yaml.load($X, yaml.Loader)
      - pattern: yaml.load($X, yaml.UnsafeLoader)
      - pattern: yaml.unsafe_load(...)
