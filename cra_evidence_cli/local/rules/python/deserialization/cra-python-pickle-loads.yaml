rules:
  - id: cra-python-pickle-loads
    message: >
      pickle.loads() (or pickle.load()) deserializes arbitrary Python objects.
      Loading pickled data from an untrusted source allows remote code execution.
      Avoid deserializing pickle data from untrusted inputs; use a safe format
      such as JSON instead.
    severity: ERROR
    metadata:
      tier: default
      cwe:
        - "CWE-502: Deserialization of Untrusted Data"
      owasp:
        - "A08:2021 - Software and Data Integrity Failures"
      references:
        - https://cwe.mitre.org/data/definitions/502.html
        - https://owasp.org/Top10/A08_2021-Software_and_Data_Integrity_Failures/
      category: security
      technology:
        - python
      confidence: HIGH
      scope: >
        Reports every pickle.loads and pickle.load call. The pickle format
        executes arbitrary constructors on load, so the call itself is the
        finding and the rule does not try to establish where the payload came
        from.
      limitations: >
        Because the origin of the payload is not analysed, a call on data the
        application fully controls, such as a constant or a file it wrote
        itself, is reported the same way as a call on request data. Review is
        needed to decide whether the input can be influenced by an attacker.
      sanitizer_analysis:
        status: not-applicable
        reason: >
          There is no sanitizer for pickle input. Signing or encrypting the
          payload limits who can supply it but does not make loading it safe,
          so no construct is treated as neutralising the call.
      license: MIT
      author: CRA Evidence
    languages: [python]
    pattern-either:
      - pattern: pickle.loads(...)
      - pattern: pickle.load(...)
