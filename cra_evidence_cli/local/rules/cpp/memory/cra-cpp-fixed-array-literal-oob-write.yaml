rules:
  - id: cra-cpp-fixed-array-literal-oob-write
    message: >
      A decimal literal index is outside the compiler-resolved fixed uint8_t
      array bound. Keep the index within the array or increase the allocation
      after validating the required size.
    severity: ERROR
    metadata:
      tier: default
      cwe: ["CWE-787: Out-of-bounds Write"]
      owasp: ["A03:2021 - Injection"]
      references:
        - https://cwe.mitre.org/data/definitions/787.html
        - https://wiki.sei.cmu.edu/confluence/display/cplusplus/CTR50-CPP.+Guarantee+that+container+indices+and+iterators+are+within+the+valid+range
      category: security
      technology: [cpp, memory-safety]
      confidence: VERY HIGH
      license: MIT
      author: CRA Evidence
      semantic_evidence:
        required: true
        language: cpp
        policy: cpp.fixed-array-literal-oob-write
        candidate_range: result
      limitations: >
        Requires code-evidence generated by an exact supported libclang C++17
        profile. Native Ubuntu 18.1.3 and container Debian 13 libclang 18.1.8
        assets use distinct profiles and exact library and header hashes. Only
        a local uint8_t array with a positive unsuffixed decimal
        bound and direct assignment through a non-negative unsuffixed decimal
        index, each of at most nine digits, is a candidate. The compiler must
        emit its array-bounds diagnostic for that exact source range. Reads,
        other element spellings, standard containers, overloaded subscripts,
        address formation, compound writes, increments, variable indices,
        other literal forms, translation units with compiler errors, and build
        configurations outside the fixed frontend profile remain outside this
        rule or degrade coverage. The broader C++ rules stay experimental.
    languages: [cpp]
    patterns:
      - pattern-inside: |
          uint8_t $ARRAY[$SIZE];
          ...
      - pattern: $ARRAY[$INDEX] = $VALUE
      - metavariable-regex:
          metavariable: $SIZE
          regex: '^[1-9][0-9]{0,8}$'
      - metavariable-regex:
          metavariable: $INDEX
          regex: '^(0|[1-9][0-9]{0,8})$'
      - metavariable-comparison:
          metavariable: $INDEX
          comparison: $INDEX >= $SIZE
