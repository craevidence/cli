      note: "Previously present in the p4 engine: andybalholm/brotli v1.2.0, klauspost/compress v1.20.1 and golang.org/x/net v0.60.0. The p5 engine embeds v1.2.8, v1.20.3 and v0.62.0, and neither 2026-11-06 architecture scan reports them."
    - id: GHSA-mgcc-cww5-fp2q
      note: "Previously reported as fixed in github.com/go-jose/go-jose/v4 v4.1.5 embedded in the p3 engine. The p4 engine embeds v4.1.6, and neither 2026-10-30 architecture scan reports it."
