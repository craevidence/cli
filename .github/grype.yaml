# Grype vulnerability gate configuration for the CRA Evidence CLI Docker image.
#
# This file holds gate waivers only: findings with a published fix at High or
# Critical severity, which would otherwise fail the
# "--fail-on high --only-fixed" gate. Each waiver is reviewed, scoped to the
# exact package version observed in the shipped image, and records its removal
# trigger. Scanner versions can disagree about sub-threshold findings, so
# scripts/check-image-gate.sh runs a second pinned comparison inventory after
# the release-blocking scan. Neither scanner is described as a complete view.
# Findings without a published fix are inventoried in grype-watchlist.yaml in
# this directory; when one of those gains a fix, the gate surfaces it and it
# gets reviewed here instead of staying suppressed.
#
# Gate scanner: Grype 0.116.1, pinned in scripts/check-image-gate.sh.
# Derived from an unfiltered Grype 0.116.1 scan, most recently re-run
# 2026-08-29 against DB schema v6.1.9 built 2026-08-29T06:26:37Z, on
# the image built from the then-current Dockerfile with bases
# dhi.io/python:3.14-dev@sha256:605fb5821aaa7d62c187110e66429b110379af0ba73e872afb5022504ba12178
# and dhi.io/python:3.14@sha256:8be06a90a353d4f1bb9e44585ae183d6112e54dfbe8af6a06774c6f4285b221d,
# with CRA Evidence Grype engine craevidence-v0.117.0-p4. The exact gate
# reported no fixed High or Critical vulnerabilities, so there are no waivers.
# The comparison scan with Grype 0.111.0 reports GO-2026-5158 at Medium for
# go.opentelemetry.io/otel 1.43.0 in the shipped engine, while Grype 0.116.1
# does not report that record against the same image and database. The same
# comparison scan also lists GO-2026-6179 and GO-2026-6180 at High severity
# for golang.org/x/mod 0.38.0. Those three remain visible in the comparison
# inventory and must be resolved by rebuilding the engine with the fixed
# dependencies, not by adding an ignore entry here.
# GO-2026-6303 affects SSH server paths. NewServerConn is absent from all four
# shipped binaries; serverAuthenticate remains in runtime method metadata.
# No reachable server path was identified. No waiver is used.
# Re-evaluate at every release.

ignore: []
