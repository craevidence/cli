# Grype vulnerability gate configuration for the CRA Evidence CLI Docker image.
#
# This file holds gate waivers only: findings with a published fix at High or
# Critical severity, which would otherwise fail the
# "--fail-on high --only-fixed" gate. Each waiver is reviewed, scoped to the
# exact package version observed in the shipped image, and records its removal
# trigger. Scanner versions can disagree about sub-threshold findings, so
# scripts/check-image-gate.sh runs a second pinned comparison inventory after
# the release-blocking scan. Neither scanner is described as a complete view.
# Findings without a published fix are inventoried in grype-watchlist.yaml in
# this directory; when one of those gains a fix, the gate surfaces it and it
# gets reviewed here instead of staying suppressed.
#
# Gate scanner: Grype 0.116.1, pinned in scripts/check-image-gate.sh.
# Reviewed 2026-10-30 against DB schema v6.1.10 built 2026-10-30T06:23:28Z,
# for the 4.11.0 release images on AMD64 and ARM64. Exact image IDs, base
# digests and scan hashes are recorded in grype-watchlist.yaml alongside the
# unfixed findings. The engine is craevidence-v0.120.1-p4 (Go 1.26.10).
# The gate reports no fixed finding. The pinned Grype 0.111.0 comparison reports
# two fixed golang.org/x/net advisories in the engine; grype-watchlist.yaml
# records them under build_info_audit with the reachability evidence.
# This does not mean the images contain no vulnerabilities. No waiver is added.
# Re-evaluate at every release.

ignore: []
