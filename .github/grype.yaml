# Grype vulnerability gate configuration for the CRA Evidence CLI Docker image.
#
# This file holds gate waivers only: findings with a published fix at High or
# Critical severity, which would otherwise fail the
# "--fail-on high --only-fixed" gate. Each waiver is reviewed, scoped to the
# exact package version observed in the shipped image, and records its removal
# trigger. Scanner versions can disagree about sub-threshold findings, so
# scripts/check-image-gate.sh runs a second pinned comparison inventory after
# the release-blocking scan. Neither scanner is described as a complete view.
# Findings without a published fix are inventoried in grype-watchlist.yaml in
# this directory; when one of those gains a fix, the gate surfaces it and it
# gets reviewed here instead of staying suppressed.
#
# Gate scanner: Grype 0.116.1, pinned in scripts/check-image-gate.sh.
# Derived from an unfiltered Grype 0.116.1 scan, most recently re-run
# 2026-09-18 against DB schema v6.1.9 built 2026-09-18T06:30:15Z, on
# local image sha256:90721357f0740f3c5b35b346bac861768d0936154bcf13adeee9ac5c3ec268f9
# built from the 4.6.0 release tree with bases
# dhi.io/python:3.14-dev@sha256:d8b5d4db6510d666e22d4fa87d4545ad0bb11a7ef9ecb54aee40a12388a65ab9
# and dhi.io/python:3.14@sha256:71245bfb85e3632288e5f9816dd9fb809e65b10e1e20f25bedf4d1a92b0a4ddd,
# with CRA Evidence Grype engine craevidence-v0.117.0-p6. The exact gate
# reported one fixed High finding, waived below. The comparison scan with
# Grype 0.111.0 lists GO-2026-6179 and GO-2026-6180 at High severity for
# golang.org/x/mod 0.38.0 in /usr/local/bin/grype, fixed in v0.40.0. They
# remain visible in the comparison inventory and must be resolved by a
# future governed engine rebuild, not by an ignore entry here.
# Re-evaluate at every release.

ignore:
  # GHSA-2v4p-qf9q-27wj (CVE-2026-84445), google.golang.org/grpc v1.83.1 in
  # /usr/local/bin/grype, fixed in 1.83.2. The advisory is a denial of
  # service in gRPC-Go servers created with xds.NewGRPCServer(): a request
  # without :authority and Host headers panics the server. The shipped
  # engine is a command-line scanner that never starts a gRPC server and
  # never imports the xds package; grpc is an indirect module dependency of
  # its container-registry and SBOM libraries. No network listener exists in
  # the image. Waived for the exact observed version only. Removal trigger:
  # the next governed engine build, which must move grpc to 1.83.2 or newer;
  # this entry then fails to match and is deleted.
  - vulnerability: GHSA-2v4p-qf9q-27wj
    package:
      name: google.golang.org/grpc
      version: v1.83.1
      location: /usr/local/bin/grype
